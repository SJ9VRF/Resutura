[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resutura-recovery"
version = "1.2.0"
description = "Effect-semantic recovery for long-horizon computer-use agents"
requires-python = ">=3.11"
authors = [{name = "Aura Yavary"}]
readme = "README.md"
license = {text = "MIT"}

[project.scripts]
resutura = "resutura.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["resutura*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[project.optional-dependencies]
browser = ["playwright>=1.50"]
