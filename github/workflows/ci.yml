name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '${{ matrix.python-version }}'}
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q
      - run: python scripts/verify_claim_map.py
      - run: python -m resutura.cli experiment --trials 20 --seed 7 --out /tmp/pilot.json
      - run: python experiments/effect_semantics_suite.py
      - run: python experiments/tool_contract_matrix.py
